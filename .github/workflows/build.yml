name: Build and push

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta-app
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/naufal05r/stokku
          tags: |
            type=raw,value=app
            type=sha,prefix=app-sha-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          cache-from: type=gha,scope=app   # ✅ scope spesifik
          cache-to: type=gha,mode=max,scope=app

      - id: meta-tools
        uses: docker/metadata-action@v5
        if: github.event_name != 'pull_request'   # ✅ skip saat PR
        with:
          images: ghcr.io/naufal05r/stokku
          tags: |
            type=raw,value=tools
            type=sha,prefix=tools-sha-,format=short

      - uses: docker/build-push-action@v6
        if: github.event_name != 'pull_request'   # ✅ skip saat PR
        with:
          context: .
          target: builder   # ✅ bukan tools
          push: true
          tags: ${{ steps.meta-tools.outputs.tags }}
          labels: ${{ steps.meta-tools.outputs.labels }}
          cache-from: type=gha,scope=tools   # ✅ scope spesifik
          cache-to: type=gha,mode=max,scope=tools
